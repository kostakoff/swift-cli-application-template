# must be unique in a given SonarQube instance
sonar.projectName=swift-cli-application-template

sonar.projectKey=kostakoff_swift-cli-application-template
sonar.organization=kostakoff

sonar.projectDescription=Swift CLI Application template
sonar.projectVersion=main

# Path is relative to the sonar-project.properties file. Defaults to .
sonar.sources=Sources

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
sonar.host.url=https://sonarcloud.io

sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
sonar.log.level=DEBUG
sonar.junit.reportPaths=test_result/
sonar.tests=Tests

sonar.language=swift
sonar.test.inclusions=.swift
sonar.exclusions=/Test/,**/.xml,Pods//*,Reports//*
sonar.swift.appName=
sonar.swift.excludedPathsFromCoverage=.Tests.
sonar.swift.coverage.reportPaths=sonar-coverage.report
